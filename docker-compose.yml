services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pia_pass}
      POSTGRES_DB: ${POSTGRES_DB:-product_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pia_user} -d ${POSTGRES_DB:-product_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp_server:
    build: ./backend
    container_name: pia_mcp_server
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8100:8100"
    command: uvicorn app.mcp_server.server:app --host 0.0.0.0 --port 8100 --reload

  backend:
    build: ./backend
    container_name: pia_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pia_user}:${POSTGRES_PASSWORD:-pia_pass}@db:5432/${POSTGRES_DB:-product_intelligence}
      MCP_SERVER_URL: http://mcp_server:8100/mcp
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      mcp_server:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: pia_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  media:
